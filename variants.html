<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.T.H Autoservice - Wall Sign Styles</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@700;900&family=Rajdhani:wght@700&family=Anton&family=Black+Ops+One&family=Russo+One&family=Saira+Stencil+One&family=Bungee&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #111;
    font-family: sans-serif;
    padding: 20px 10px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  h1 {
    color: #c8a44e;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 6px;
  }
  .subtitle {
    color: #555;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 10px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 28px;
    width: 100%;
    max-width: 860px;
  }

  /* === WALL PANEL === each variant only sets the custom properties below === */
  .wall {
    position: relative;
    width: 100%;
    aspect-ratio: 16/8;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    background: var(--wall-bg);
    opacity: 0;
    transform: translateY(20px);
    animation: panelIn 0.6s ease-out forwards;
  }
  .wall::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: var(--wall-overlay, none);
  }

  .sign { position: relative; z-index: 2; text-align: right; padding: 30px 40px; }

  .dth {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    line-height: 1;
    margin-bottom: 2px;
    font-family: var(--dth-font);
    font-weight: var(--dth-weight, 400);
    font-size: var(--dth-size);
    gap: var(--dth-gap, 4px);
  }
  .dth span {
    background: var(--dth-grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: var(--dth-filter);
  }
  .dth .dot { font-size: var(--dot-size); margin: 0 -2px; }

  .auto {
    display: block;
    line-height: 1;
    text-align: right;
    text-transform: uppercase;
    font-family: var(--auto-font);
    font-weight: var(--auto-weight, 400);
    font-size: var(--auto-size);
    letter-spacing: var(--auto-spacing);
    background: var(--auto-grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: var(--auto-filter);
  }

  .style-label {
    position: absolute;
    bottom: 12px;
    left: 16px;
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Chakra Petch', sans-serif;
    z-index: 3;
  }

  /* 1 - Orbitron / Futuristic */
  .wall-1 {
    --wall-bg: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
    --wall-overlay:
      radial-gradient(ellipse at 50% 40%, rgba(0,150,255,0.04) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,150,255,0.015) 40px, rgba(0,150,255,0.015) 41px),
      repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,150,255,0.015) 40px, rgba(0,150,255,0.015) 41px);
    --dth-font: 'Orbitron', sans-serif; --dth-weight: 900; --dth-size: clamp(50px, 11vw, 110px); --dot-size: 0.6em;
    --dth-grad: linear-gradient(180deg, #00d4ff 0%, #0088cc 40%, #00aaee 60%, #66e0ff 100%);
    --dth-filter: drop-shadow(0 0 12px rgba(0,180,255,0.4)) drop-shadow(2px 4px 2px rgba(0,0,0,0.8));
    --auto-font: 'Rajdhani', sans-serif; --auto-weight: 700; --auto-size: clamp(22px, 4.8vw, 48px); --auto-spacing: clamp(8px, 2vw, 22px);
    --auto-grad: linear-gradient(180deg, #ffffff 0%, #88aacc 50%, #556688 100%);
    --auto-filter: drop-shadow(1px 2px 1px rgba(0,0,0,0.8));
    animation-delay: .1s;
  }

  /* 2 - Bebas Neue / Classic Gold */
  .wall-2 {
    --wall-bg: linear-gradient(135deg, #2c2c2c 0%, #3a3a3a 30%, #2e2e2e 60%, #333 100%);
    --wall-overlay: radial-gradient(ellipse at 45% 35%, rgba(255,255,255,0.04) 0%, transparent 50%);
    --dth-font: 'Bebas Neue', sans-serif; --dth-size: clamp(60px, 13vw, 130px); --dth-gap: 2px; --dot-size: 0.7em;
    --dth-grad: linear-gradient(170deg, #f7e8a0 0%, #d4a843 20%, #c49632 35%, #e8c95a 48%, #f5e291 53%, #b8912a 70%, #c9a03e 90%);
    --dth-filter: drop-shadow(2px 3px 1px rgba(0,0,0,0.75)) drop-shadow(4px 6px 5px rgba(0,0,0,0.35));
    --auto-font: 'Bebas Neue', sans-serif; --auto-size: clamp(26px, 5.5vw, 56px); --auto-spacing: clamp(6px, 1.8vw, 20px);
    --auto-grad: linear-gradient(175deg, #fff 0%, #ddd 30%, #aaa 55%, #ccc 80%, #eee 100%);
    --auto-filter: drop-shadow(1px 2px 1px rgba(0,0,0,0.8)) drop-shadow(3px 5px 4px rgba(0,0,0,0.3));
    animation-delay: .2s;
  }

  /* 3 - Black Ops One / Military */
  .wall-3 {
    --wall-bg: linear-gradient(160deg, #1a1a10 0%, #2a2a1a 40%, #1e1e12 100%);
    --wall-overlay:
      radial-gradient(ellipse at 55% 40%, rgba(180,160,80,0.04) 0%, transparent 55%),
      repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(0,0,0,0.02) 20px, rgba(0,0,0,0.02) 21px);
    --dth-font: 'Black Ops One', cursive; --dth-size: clamp(44px, 10vw, 100px); --dth-gap: 6px; --dot-size: 0.55em;
    --dth-grad: linear-gradient(170deg, #b8c46a 0%, #8a9a30 25%, #a4b44e 45%, #d0dd80 52%, #8a9a30 65%, #6a7820 85%, #98a840 100%);
    --dth-filter: drop-shadow(2px 3px 1px rgba(0,0,0,0.85)) drop-shadow(4px 7px 5px rgba(0,0,0,0.4));
    --auto-font: 'Chakra Petch', sans-serif; --auto-weight: 700; --auto-size: clamp(20px, 4.5vw, 44px); --auto-spacing: clamp(5px, 1.5vw, 16px);
    --auto-grad: linear-gradient(175deg, #e8dcc0 0%, #c8b890 40%, #a09070 70%, #c0b090 100%);
    --auto-filter: drop-shadow(1px 2px 1px rgba(0,0,0,0.85));
    animation-delay: .3s;
  }

  /* 4 - Bungee / Retro Bold */
  .wall-4 {
    --wall-bg: linear-gradient(135deg, #1a0a0a 0%, #2a1010 50%, #1a0808 100%);
    --wall-overlay: radial-gradient(ellipse at 50% 45%, rgba(255,50,0,0.04) 0%, transparent 55%);
    --dth-font: 'Bungee', cursive; --dth-size: clamp(46px, 10vw, 100px); --dot-size: 0.55em;
    --dth-grad: linear-gradient(170deg, #ff6644 0%, #dd2200 20%, #ff4422 42%, #ff8866 50%, #dd3311 60%, #bb1100 80%, #dd3322 100%);
    --dth-filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.9)) drop-shadow(5px 7px 0 rgba(80,0,0,0.5)) drop-shadow(0 0 20px rgba(255,50,0,0.15));
    --auto-font: 'Bungee', cursive; --auto-size: clamp(17px, 3.8vw, 37px); --auto-spacing: clamp(4px, 1.2vw, 12px);
    --auto-grad: linear-gradient(175deg, #ffeedd 0%, #ffccaa 30%, #cc9966 60%, #ffbb88 90%);
    --auto-filter: drop-shadow(1px 2px 0 rgba(0,0,0,0.9)) drop-shadow(3px 4px 0 rgba(60,0,0,0.4));
    animation-delay: .4s;
  }

  /* 5 - Saira Stencil One / Stencil Cut */
  .wall-5 {
    --wall-bg: linear-gradient(135deg, #1a1a2a 0%, #222235 40%, #181828 100%);
    --wall-overlay:
      radial-gradient(ellipse at 48% 42%, rgba(180,140,255,0.035) 0%, transparent 55%),
      repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255,255,255,0.008) 60px, rgba(255,255,255,0.008) 61px);
    --dth-font: 'Saira Stencil One', cursive; --dth-size: clamp(46px, 10vw, 100px); --dot-size: 0.6em;
    --dth-grad: linear-gradient(170deg, #e0d0ff 0%, #a080dd 22%, #8060bb 40%, #c0a8f0 50%, #e0d0ff 54%, #9070cc 68%, #7050aa 82%, #a888dd 100%);
    --dth-filter: drop-shadow(2px 3px 1px rgba(0,0,0,0.8)) drop-shadow(4px 6px 5px rgba(0,0,0,0.35)) drop-shadow(0 0 18px rgba(140,100,220,0.15));
    --auto-font: 'Saira Stencil One', cursive; --auto-size: clamp(17px, 3.8vw, 38px); --auto-spacing: clamp(4px, 1.2vw, 14px);
    --auto-grad: linear-gradient(175deg, #ffffff 0%, #ccbbee 40%, #9988bb 70%, #bbaadd 100%);
    --auto-filter: drop-shadow(1px 2px 1px rgba(0,0,0,0.85));
    animation-delay: .5s;
  }

  /* 6 - Russo One / Sport Garage */
  .wall-6 {
    --wall-bg: linear-gradient(135deg, #222 0%, #333 30%, #282828 60%, #2a2a2a 100%);
    --wall-overlay:
      radial-gradient(ellipse at 50% 40%, rgba(255,200,0,0.035) 0%, transparent 55%),
      repeating-linear-gradient(90deg, transparent, transparent 150px, rgba(255,255,255,0.01) 150px, rgba(255,255,255,0.01) 151px),
      repeating-linear-gradient(0deg, transparent, transparent 150px, rgba(255,255,255,0.01) 150px, rgba(255,255,255,0.01) 151px);
    --dth-font: 'Russo One', sans-serif; --dth-size: clamp(52px, 11vw, 115px); --dot-size: 0.6em;
    --dth-grad: linear-gradient(170deg, #ffe866 0%, #ffcc00 18%, #e6a800 35%, #ffd633 48%, #ffee88 53%, #e6b800 65%, #cc9900 80%, #e6b800 100%);
    --dth-filter: drop-shadow(2px 3px 1px rgba(0,0,0,0.8)) drop-shadow(4px 7px 5px rgba(0,0,0,0.4)) drop-shadow(0 0 15px rgba(255,200,0,0.1));
    --auto-font: 'Russo One', sans-serif; --auto-size: clamp(22px, 4.8vw, 50px); --auto-spacing: clamp(5px, 1.6vw, 17px);
    --auto-grad: linear-gradient(175deg, #fff 0%, #e0e0e0 25%, #aaa 50%, #ccc 75%, #eee 100%);
    --auto-filter: drop-shadow(1px 2px 1px rgba(0,0,0,0.85)) drop-shadow(3px 5px 4px rgba(0,0,0,0.3));
    animation-delay: .6s;
  }

  @keyframes panelIn { to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<h1>D.T.H Autoservice</h1>
<div class="subtitle">6 variante de litere 3D pentru perete</div>

<div class="grid">
  <div class="wall wall-1"><div class="sign"><div class="dth"><span>D</span><span class="dot">.</span><span>T</span><span class="dot">.</span><span>H</span></div><span class="auto">Autoservice</span></div><div class="style-label">① Futuristic</div></div>
  <div class="wall wall-2"><div class="sign"><div class="dth"><span>D</span><span class="dot">.</span><span>T</span><span class="dot">.</span><span>H</span></div><span class="auto">Autoservice</span></div><div class="style-label">② Classic Gold</div></div>
  <div class="wall wall-3"><div class="sign"><div class="dth"><span>D</span><span class="dot">.</span><span>T</span><span class="dot">.</span><span>H</span></div><span class="auto">Autoservice</span></div><div class="style-label">③ Military</div></div>
  <div class="wall wall-4"><div class="sign"><div class="dth"><span>D</span><span class="dot">.</span><span>T</span><span class="dot">.</span><span>H</span></div><span class="auto">Autoservice</span></div><div class="style-label">④ Retro Bold</div></div>
  <div class="wall wall-5"><div class="sign"><div class="dth"><span>D</span><span class="dot">.</span><span>T</span><span class="dot">.</span><span>H</span></div><span class="auto">Autoservice</span></div><div class="style-label">⑤ Stencil Cut</div></div>
  <div class="wall wall-6"><div class="sign"><div class="dth"><span>D</span><span class="dot">.</span><span>T</span><span class="dot">.</span><span>H</span></div><span class="auto">Autoservice</span></div><div class="style-label">⑥ Sport Garage</div></div>
</div>

</body>
</html>
