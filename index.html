<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.T.H Autoservice - Wall Sign Design</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@700&family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
  }

  .wall {
    position: relative;
    width: 900px;
    max-width: 95vw;
    aspect-ratio: 16/10;
    background:
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 298px,
        rgba(0,0,0,0.08) 298px,
        rgba(0,0,0,0.08) 302px
      ),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 148px,
        rgba(0,0,0,0.06) 148px,
        rgba(0,0,0,0.06) 152px
      ),
      linear-gradient(135deg, #3a3a3a 0%, #2a2a2a 30%, #333 60%, #2e2e2e 100%);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.6),
      inset 0 0 100px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  .wall::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 40% 35%, rgba(255,255,255,0.06) 0%, transparent 60%),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  .sign-container {
    position: relative;
    z-index: 2;
    text-align: right;
    padding: 40px;
  }

  /* ===== D.T.H ===== */
  .dth-line {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 4px;
    margin-bottom: -8px;
  }

  .dth-letter {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(60px, 12vw, 130px);
    line-height: 1;
    letter-spacing: 2px;
    color: #c8a44e;
    background: linear-gradient(
      170deg,
      #f7e8a0 0%,
      #d4a843 18%,
      #c49632 30%,
      #e8c95a 45%,
      #f5e291 50%,
      #d9b44a 55%,
      #b8912a 70%,
      #c9a03e 82%,
      #e2c460 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(2px 3px 1px rgba(0,0,0,0.7))
            drop-shadow(4px 6px 4px rgba(0,0,0,0.4))
            drop-shadow(0px 0px 15px rgba(200,164,78,0.15));
    position: relative;
  }

  .dth-dot {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(40px, 8vw, 90px);
    line-height: 1;
    color: #c8a44e;
    background: linear-gradient(
      170deg,
      #f7e8a0 0%,
      #d4a843 25%,
      #e8c95a 50%,
      #b8912a 75%,
      #d9b44a 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(2px 3px 1px rgba(0,0,0,0.7))
            drop-shadow(4px 6px 4px rgba(0,0,0,0.4));
    margin: 0 -2px;
    align-self: center;
  }

  /* ===== AUTOSERVICE ===== */
  .autoservice-line {
    display: block;
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 5.5vw, 60px);
    letter-spacing: clamp(6px, 1.5vw, 18px);
    line-height: 1;
    text-transform: uppercase;
    text-align: right;
    color: #d0d0d0;
    background: linear-gradient(
      175deg,
      #ffffff 0%,
      #e8e8e8 15%,
      #b0b0b0 35%,
      #d8d8d8 48%,
      #f0f0f0 52%,
      #c0c0c0 65%,
      #a0a0a0 80%,
      #d0d0d0 95%,
      #e8e8e8 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(1px 2px 1px rgba(0,0,0,0.8))
            drop-shadow(3px 5px 4px rgba(0,0,0,0.35))
            drop-shadow(0px 0px 10px rgba(180,180,180,0.08));
    margin-top: 8px;
  }

  /* Subtle light reflection on wall behind letters */
  .sign-container::before {
    content: '';
    position: absolute;
    top: -20px;
    right: -20px;
    bottom: -20px;
    left: -20px;
    background: radial-gradient(ellipse at 55% 40%, rgba(200,164,78,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
  }

  /* ===== ANIMATIONS ===== */
  .dth-letter, .dth-dot, .autoservice-line {
    opacity: 0;
    animation: fadeInUp 0.8s ease-out forwards;
  }

  .dth-letter:nth-child(1) { animation-delay: 0.2s; }
  .dth-dot:nth-child(2)    { animation-delay: 0.35s; }
  .dth-letter:nth-child(3) { animation-delay: 0.5s; }
  .dth-dot:nth-child(4)    { animation-delay: 0.65s; }
  .dth-letter:nth-child(5) { animation-delay: 0.8s; }
  .autoservice-line         { animation-delay: 1.1s; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== STYLE SELECTOR ===== */
  .controls {
    margin-top: 30px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .style-btn {
    padding: 10px 22px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 30px;
    background: rgba(255,255,255,0.05);
    color: #aaa;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .style-btn:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
  }
  .style-btn.active {
    background: rgba(200,164,78,0.2);
    color: #e8c95a;
    border-color: #c8a44e;
  }

  /* ===== STYLE VARIANTS ===== */

  /* Chrome / Silver */
  .wall.style-chrome .dth-letter {
    background: linear-gradient(170deg, #fff 0%, #ccc 20%, #888 40%, #ddd 50%, #fff 55%, #aaa 70%, #999 85%, #ccc 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(2px 3px 1px rgba(0,0,0,0.8)) drop-shadow(4px 6px 4px rgba(0,0,0,0.4)) drop-shadow(0 0 20px rgba(200,200,255,0.1));
  }
  .wall.style-chrome .dth-dot {
    background: linear-gradient(170deg, #fff 0%, #bbb 30%, #ddd 50%, #999 75%, #ccc 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(2px 3px 1px rgba(0,0,0,0.8)) drop-shadow(4px 6px 4px rgba(0,0,0,0.4));
  }
  .wall.style-chrome .autoservice-line {
    background: linear-gradient(175deg, #e0e0e0 0%, #999 30%, #ccc 50%, #888 70%, #bbb 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  /* Red & Black */
  .wall.style-red {
    background:
      repeating-linear-gradient(90deg, transparent, transparent 298px, rgba(0,0,0,0.08) 298px, rgba(0,0,0,0.08) 302px),
      repeating-linear-gradient(0deg, transparent, transparent 148px, rgba(0,0,0,0.06) 148px, rgba(0,0,0,0.06) 152px),
      linear-gradient(135deg, #1a1a1a 0%, #111 50%, #1a1a1a 100%);
  }
  .wall.style-red .dth-letter {
    background: linear-gradient(170deg, #ff4444 0%, #cc0000 25%, #ff2222 45%, #ff6666 52%, #cc0000 65%, #990000 80%, #cc2222 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(2px 3px 1px rgba(0,0,0,0.8)) drop-shadow(4px 6px 4px rgba(0,0,0,0.5)) drop-shadow(0 0 25px rgba(255,0,0,0.15));
  }
  .wall.style-red .dth-dot {
    background: linear-gradient(170deg, #ff4444 0%, #cc0000 40%, #ff3333 60%, #990000 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(2px 3px 1px rgba(0,0,0,0.8)) drop-shadow(4px 6px 4px rgba(0,0,0,0.5));
  }
  .wall.style-red .autoservice-line {
    background: linear-gradient(175deg, #ffffff 0%, #ddd 30%, #aaa 50%, #ddd 70%, #fff 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  /* Brushed Copper */
  .wall.style-copper .dth-letter {
    background: linear-gradient(170deg, #e8b88a 0%, #c47a40 20%, #a05520 38%, #d49560 48%, #ecc8a0 53%, #c07838 65%, #8a4010 80%, #b86830 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(2px 3px 1px rgba(0,0,0,0.7)) drop-shadow(4px 6px 4px rgba(0,0,0,0.4)) drop-shadow(0 0 15px rgba(200,120,56,0.12));
  }
  .wall.style-copper .dth-dot {
    background: linear-gradient(170deg, #e8b88a 0%, #b06828 35%, #d49560 55%, #8a4010 80%, #c07838 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(2px 3px 1px rgba(0,0,0,0.7)) drop-shadow(4px 6px 4px rgba(0,0,0,0.4));
  }
  .wall.style-copper .autoservice-line {
    background: linear-gradient(175deg, #2a2a2a 0%, #444 30%, #222 50%, #3a3a3a 70%, #1a1a1a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(1px 2px 1px rgba(0,0,0,0.9)) drop-shadow(3px 5px 4px rgba(0,0,0,0.4));
  }

  .label {
    color: #555;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    margin-top: 20px;
    font-family: 'Montserrat', sans-serif;
  }
</style>
</head>
<body>

<div class="wall" id="wall">
  <div class="sign-container">
    <div class="dth-line">
      <span class="dth-letter">D</span>
      <span class="dth-dot">.</span>
      <span class="dth-letter">T</span>
      <span class="dth-dot">.</span>
      <span class="dth-letter">H</span>
    </div>
    <span class="autoservice-line">Autoservice</span>
  </div>
</div>

<div class="controls">
  <button class="style-btn active" onclick="setStyle('', this)">Gold</button>
  <button class="style-btn" onclick="setStyle('style-chrome', this)">Chrome</button>
  <button class="style-btn" onclick="setStyle('style-red', this)">Red</button>
  <button class="style-btn" onclick="setStyle('style-copper', this)">Copper</button>
</div>

<div class="label">Design preview — Litere 3D pe perete</div>

<script>
function setStyle(cls, btn) {
  const wall = document.getElementById('wall');
  wall.className = 'wall' + (cls ? ' ' + cls : '');
  document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
</body>
</html>
